name: Вакансии в чат

on:
  # Расписания здесь нет: раз в день workflow запускает внешний сервис cron-job.org (см. README).
  # Не добавляйте schedule, иначе в группу придёт два сообщения.
  workflow_dispatch:       # запуск через API (cron-job.org) или кнопкой «Run workflow»

permissions:
  contents: write          # чтобы закоммитить обновлённый sent.json

concurrency:
  group: vacancy-bot       # два запуска одновременно не идут, иначе вакансии могут уйти дважды
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать и отправить вакансии
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Сохранить sent.json в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          if git diff --cached --quiet; then
            echo "sent.json не изменился"
          else
            git commit -m "sent.json: отправлено $(date -u +%F)"
            git push
          fi
