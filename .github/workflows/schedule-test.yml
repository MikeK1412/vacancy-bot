name: Тест расписания

# Временный workflow: проверяем, запускает ли GitHub расписания в этом репозитории. Бота не трогает.
on:
  schedule:
    - cron: "3-59/10 * * * *"   # :03, :13, :23, :33, :43, :53 каждого часа (UTC)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "event: ${{ github.event_name }}"
